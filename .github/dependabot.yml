version: 2
updates:
  # Dependency-update delay via Dependabot's `cooldown` block. Holds back PRs
  # for freshly published versions so the project does not auto-adopt a
  # release on day zero — gives the ecosystem (and the maintainer) time to
  # surface regressions before they land on main. Mirrors Renovate's
  # `minimumReleaseAge` behaviour. Closes the `min_release_age` criterion.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    ignore:
      # TypeScript 7 ships no in-process compiler API; the analyzer stays on
      # 6.x until a deliberate migration (docs/typescript-7-decision.md).
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 5
