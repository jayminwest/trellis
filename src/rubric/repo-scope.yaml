# Repo-scope criteria (SPEC §5, §6.1) — the WHAT layer; never names a tool.
#
# The 30 criteria scored once for the whole repository (denominator always 1).
# Grouped by category in §5 order. Fields per SPEC §6.1:
#   id, category, scope, level, skippable, discoveryVia,
#   investigation (non-null IFF discoveryVia: agent),
#   gate (reserved; exactly one per category), weight (reserved; default 1).
# `gate`, `weight`, and a null `investigation` rely on schema defaults when
# omitted. Clean-room authored from SPEC §5.
#
# Transitional (SPEC §14 stage 2): the agent-discovery criteria are retired —
# every remaining criterion is deterministic.

# --- 5.2 Code Quality (2 R) -----------------------------------------------

