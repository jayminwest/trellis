# Repo-scope criteria (SPEC §5, §6.1) — the WHAT layer; never names a tool.
#
# The 44 criteria scored once for the whole repository (denominator always 1).
# Grouped by category in §5 order. Fields per SPEC §6.1:
#   id, category, scope, level, skippable, discoveryVia,
#   investigation (non-null IFF discoveryVia: agent),
#   gate (reserved; exactly one per category), weight (reserved; default 1).
# `gate`, `weight`, and a null `investigation` rely on schema defaults when
# omitted. Clean-room authored from SPEC §5.

# --- 5.1 Documentation (10, all R, all agent) -----------------------------
# Areas: documentation, agent-config.

# README at root with setup/usage.
- id: readme
  category: documentation
  scope: repo
  level: 1
  skippable: false
  discoveryVia: agent
  investigation: documentation

# Non-trivial agent-instructions file.
- id: agents_md
  category: documentation
  scope: repo
  level: 2
  skippable: false
  discoveryVia: agent
  investigation: agent-config

