  category: documentation
  scope: repo
  level: 3
  skippable: false
  discoveryVia: agent
  investigation: documentation
  gate: true

# >=1 valid skill.
- id: skills
  category: documentation
  scope: repo
  level: 3
  skippable: false
  discoveryVia: agent
