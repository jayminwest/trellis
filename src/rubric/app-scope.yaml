# App-scope criteria (SPEC §5, §6.1) — the WHAT layer; never names a tool.
#
# The 40 criteria scored once per discovered app (denominator N = app count,
# else 1; numerator = count of apps that pass). Grouped by category in §5 order.
# Fields per SPEC §6.1:
#   id, category, scope, level, skippable, discoveryVia,
#   investigation (non-null IFF discoveryVia: agent),
#   gate (reserved; exactly one per category), weight (reserved; default 1).
# `gate`, `weight`, and a null `investigation` rely on schema defaults when
# omitted. Clean-room authored from SPEC §5.
#
# Transitional (SPEC §14 stage 2): the agent-discovery criteria are retired —
# every remaining criterion is deterministic.

# --- 5.2 Code Quality (10 A) ----------------------------------------------

# Linter configured with real rules.
- id: lint_config
  category: code_quality
  scope: app
  level: 1
  skippable: false
  discoveryVia: deterministic

# GATE: type-checker configured and clean.
- id: type_check
  category: code_quality
  scope: app
  level: 1
  skippable: false
  discoveryVia: deterministic
  gate: true

# Autoformatter configured.
- id: formatter
  category: code_quality
  scope: app
  level: 1
  skippable: false
  discoveryVia: deterministic

# Strict mode, no implicit-any.
- id: strict_typing
  category: code_quality
  scope: app
  level: 2
  skippable: true
  discoveryVia: deterministic

# Naming conventions enforced.
- id: naming_consistency
  category: code_quality
  scope: app
  level: 3
  skippable: false
  discoveryVia: deterministic

# Unused-export/unreachable analyzer clean.
- id: dead_code_detection
  category: code_quality
  scope: app
  level: 3
  skippable: false
  discoveryVia: deterministic

# Copy-paste detector under threshold.
- id: duplicate_code_detection
  category: code_quality
  scope: app
  level: 3
  skippable: false
  discoveryVia: deterministic

# Unused declared deps flagged.
- id: unused_dependencies_detection
  category: code_quality
  scope: app
  level: 3
  skippable: false
  discoveryVia: deterministic

# Import-direction analyzer.
- id: code_modularization
  category: code_quality
  scope: app
  level: 4
  skippable: true
  discoveryVia: deterministic

# Per-function complexity capped.
- id: cyclomatic_complexity
  category: code_quality
  scope: app
  level: 5
  skippable: false
  discoveryVia: deterministic

